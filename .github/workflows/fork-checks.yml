name: fork checks

# Runs the pull-request checks in a fork, where they are not held for approval.
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream:
    # A repository that is nobody's fork runs these on push and on pull_request.
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      clone_url: ${{ steps.parent.outputs.clone_url }}
    steps:
      - name: Read the repository this one was forked from
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "clone_url=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.clone_url')" >> "$GITHUB_OUTPUT"

  meet:
    needs: upstream
    permissions:
      contents: read
    uses: ./.github/workflows/meet.yml
    with:
      base_repo: ${{ needs.upstream.outputs.clone_url }}
