name: fork checks

# Runs the pull-request checks in a fork, where they are not held for approval.
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meet:
    # A repository that is nobody's fork runs these on push and on pull_request.
    if: github.event.repository.fork
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
